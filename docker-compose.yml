version: '3.8'

services:
  browsershot-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: openrpa/browsershot-service:latest
    container_name: browsershot-server
    ports:
      - "8080:8080"
    environment:
      - CHROMIUM_WS_PORT=9222
      - MAX_CONCURRENCY=10
      - DEFAULT_TIMEOUT=30
      - DEFAULT_WIDTH=1920
      - DEFAULT_HEIGHT=1080
    shm_size: '2gb'
    volumes:
      - ./src:/app/src
      - ./bin:/app/bin
      - ./server/server.php:/app/server/server.php
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

networks:
  default:
    name: browsershot-network